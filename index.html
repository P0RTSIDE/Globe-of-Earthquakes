<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Ubuntu:wght@500&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas class="webgl"></canvas>
    <nav>
      <a href="/">Sphere</a>
      <ul>
        <li>Interactive</li>
        <li>Real-time Data</li>
      </ul>
    </nav>
    <h1 class="title">Earthquake Globe</h1>
    <div class="earthquake-info">
      <div class="info-item">
        <span class="label">Loading...</span>
      </div>
    </div>
    <div class="instructions">
      <p>🖱️ Click and drag to rotate | Scroll to zoom | Hover over spikes for details</p>
      <p>🌍 Earth texture shows geography | Spike Height = Frequency | Color = Avg Magnitude</p>
    </div>
    <div class="hover-tooltip" id="hoverTooltip" style="display: none;">
      <div class="tooltip-content"></div>
    </div>
    <div class="earthquake-list" id="earthquakeList">
      <div class="list-header">
        <h2>Recent Earthquakes</h2>
        <span class="list-count" id="listCount">0</span>
      </div>
      <div class="list-content" id="listContent">
        <div class="list-loading">Loading earthquakes...</div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
